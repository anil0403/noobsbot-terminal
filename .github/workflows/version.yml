# Cuts a release after each push to main, from the commits since the last tag.
# The bump is read from commit subjects: "feat!:" / "BREAKING" → major, "feat:" → minor,
# anything else → patch. Bumps both crates, tags, creates the GitHub release
# (auto notes), then starts the Linux and macOS release builds for the tag.
name: version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: auto, major, minor or patch
        default: auto

permissions:
  contents: write
  actions: write

# One at a time: a push made while a release runs waits, then releases whatever
# is new on main's tip (checked out below, not the pushed commit), if anything.
# The "vX.Y.Z" commit this pushes uses GITHUB_TOKEN, which starts no workflows.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0)
          log=$(git log --format='%s%n%b' "$last..HEAD")
          [[ -n $log ]] || { echo "nothing since $last"; exit 0; }
          bump=${{ inputs.bump || 'auto' }}
          if [[ $bump == auto ]]; then
            if grep -Eq '^[a-z]+(\(.+\))?!:|BREAKING' <<<"$log"; then bump=major
            elif grep -Eq '^feat(\(.+\))?:' <<<"$log"; then bump=minor
            else bump=patch; fi
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          case $bump in
            major) v="$((major + 1)).0.0" ;;
            minor) v="$major.$((minor + 1)).0" ;;
            patch) v="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "0,/^version = /s/^version = .*/version = \"$v\"/" Cargo.toml macos/Cargo.toml
          sed -i "/^name = \"noobsbot\"\$/{n;s/^version = .*/version = \"$v\"/}" Cargo.lock macos/Cargo.lock
          git config user.name github-actions && git config user.email actions@github.com
          git commit -am "v$v"
          git tag -a "v$v" -m "v$v"
          git push --follow-tags
          gh release create "v$v" --generate-notes
          gh workflow run release.yml --ref "v$v"
          gh workflow run macos.yml --ref "v$v"
        env:
          GH_TOKEN: ${{ github.token }}
