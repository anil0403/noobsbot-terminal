# Cuts a release once a day, or when started by hand, from the commits since the
# last tag. No release when nothing changed but docs and GitHub files (unless a
# bump is chosen by hand), or when the last CI run on main failed.
# The bump is read from commit subjects only (bodies can quote other commits):
# "type!:" or "BREAKING" → major, "feat:" → minor, anything else → patch.
# Bumps both crates, tags, creates the GitHub release (auto notes) as a draft,
# then starts the Linux and macOS release builds for the tag. The last of the
# two to upload its file publishes the release, so "latest" never lacks them.
name: version

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: auto, major, minor or patch
        default: auto

permissions:
  contents: write
  actions: write

# One at a time, so a manual run and the daily one can't cut the same version.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0)
          log=$(git log --format='%s' "$last..HEAD")
          [[ -n $log ]] || { echo "nothing since $last"; exit 0; }
          bump=${{ inputs.bump || 'auto' }}
          code=$(git diff --name-only "$last..HEAD" | grep -Ev '\.md$|^\.github/|^extra/screenshots/|^LICENSE$' || true)
          if [[ -z $code && $bump == auto ]]; then echo "only docs changed since $last"; exit 0; fi
          for wf in release.yml macos.yml; do
            ok=$(gh run list --workflow "$wf" --branch main --event push --status completed --limit 1 --json conclusion -q '.[0].conclusion // "success"')
            [[ $ok == success ]] || { echo "::error::the last $wf run on main ended with \"$ok\"; fix main first"; exit 1; }
          done
          if [[ $bump == auto ]]; then
            if grep -Eq '^[a-z]+(\(.+\))?!:|BREAKING' <<<"$log"; then bump=major
            elif grep -Eq '^feat(\(.+\))?:' <<<"$log"; then bump=minor
            else bump=patch; fi
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          case $bump in
            major) v="$((major + 1)).0.0" ;;
            minor) v="$major.$((minor + 1)).0" ;;
            patch) v="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "0,/^version = /s/^version = .*/version = \"$v\"/" Cargo.toml macos/Cargo.toml
          sed -i "/^name = \"noobsbot\"\$/{n;s/^version = .*/version = \"$v\"/}" Cargo.lock macos/Cargo.lock
          git config user.name github-actions && git config user.email actions@github.com
          git commit -am "v$v"
          git tag -a "v$v" -m "v$v"
          git push --follow-tags
          gh release create "v$v" --generate-notes --draft
          gh workflow run release.yml --ref "v$v"
          gh workflow run macos.yml --ref "v$v"
        env:
          GH_TOKEN: ${{ github.token }}
