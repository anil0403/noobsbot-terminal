# Builds noobsbot on an older Ubuntu, so the binary runs on any distro with
# glibc 2.35 or newer. A pushed v* tag also attaches it to that GitHub release.
# Pushes to main test it and keep the compiled dependencies cached there, which
# release runs (tags) reuse: a tag can only read main's cache, not another tag's.
# Pull requests are tested too.
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["macos/**", "**.md", "extra/screenshots/**"]
  pull_request:
    paths-ignore: ["macos/**", "**.md", "extra/screenshots/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y zsh # for the zsh integration's test
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=noobsbot-${GITHUB_REF_NAME#v}-x86_64-linux
          [[ $GITHUB_REF == refs/tags/* ]] || name=noobsbot-dev-x86_64-linux
          mkdir "$name"
          cp target/release/noobsbot LICENSE README.md extra/noobsbot.desktop extra/noobsbot.svg \
            extra/noobsbot.terminfo extra/config.example.toml "$name"/
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz*
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" "$NAME.tar.gz" "$NAME.tar.gz.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
