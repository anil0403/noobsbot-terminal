# The macOS port (macos/): tests on Apple Silicon, builds a universal
# Noobsbot.app, opens it once to check it starts and draws. A pushed v* tag
# also attaches the app to that GitHub release. Pull requests are tested too,
# but their app is never signed with our certificate.
name: macos

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: macos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      # Compiled dependencies, saved on main pushes; release runs (tags) reuse main's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos
      - run: cargo test --release --locked
      - name: Shell scripts and terminfo
        run: |
          /bin/bash -n shell/noobsbot.bash   # macOS's own bash 3.2
          zsh -n shell/zsh/noobsbot.zsh shell/zsh/.zshenv
          tic -x -o "$RUNNER_TEMP/ti" extra/noobsbot.terminfo
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      # The "Noobsbot Terminal" certificate (repo secrets), so permissions stay after
      # an update (see package.sh). Without the secrets the app is signed ad hoc,
      # except for a release, which then fails.
      - name: Signing certificate
        if: github.event_name != 'pull_request'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [[ $GITHUB_REF == refs/tags/* ]] && echo "REQUIRE_SIGNING=1" >> "$GITHUB_ENV"
          if [[ -z $P12 ]]; then echo "no certificate: ad-hoc signature"; exit 0; fi
          kc=$RUNNER_TEMP/signing.keychain-db
          pw=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          # codesign only finds the key in a keychain on the search list.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - run: ./package.sh
      - run: codesign -dr - target/Noobsbot.app
      - name: Smoke test
        continue-on-error: true # a VM may have no usable GPU
        run: |
          RUST_LOG=info target/Noobsbot.app/Contents/MacOS/noobsbot > "$RUNNER_TEMP/run.log" 2>&1 &
          sleep 15
          screencapture -x "$RUNNER_TEMP/screen.png" || true
          # Type a command, Cmd+D (split right), another command; needs System Events access.
          osascript -e 'tell application "System Events"' -e 'keystroke "echo hello from noobsbot"' -e 'key code 36' \
            -e 'delay 1' -e 'keystroke "d" using command down' -e 'delay 2' -e 'keystroke "ls /Applications"' -e 'key code 36' \
            -e 'end tell' || true
          sleep 3
          screencapture -x "$RUNNER_TEMP/keys.png" || true
          kill -0 $! && echo "still running after 15 s"
          kill $! || true
          cat "$RUNNER_TEMP/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/run.log
      - name: Zip
        run: |
          name=noobsbot-${GITHUB_REF_NAME#v}-macos-universal
          [[ $GITHUB_REF == refs/tags/* ]] || name=noobsbot-dev-macos-universal
          (cd target && ditto -c -k --keepParent Noobsbot.app "../$name.zip")
          shasum -a 256 "$name.zip" > "$name.zip.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: macos/${{ env.NAME }}.zip*
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "$GITHUB_REF_NAME" "$NAME.zip" "$NAME.zip.sha256" --clobber
          # Publish once both builds have uploaded: the other may still be running,
          # and the last one to get here sees both files.
          n=$(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[].name | select(endswith(".tar.gz") or endswith(".zip"))] | length')
          if (( n >= 2 )); then gh release edit "$GITHUB_REF_NAME" --draft=false --latest; fi
        env:
          GH_TOKEN: ${{ github.token }}

  # The installer as a user runs it (builds from source while there's no release).
  install:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash install.sh
      - run: |
          test -x /Applications/Noobsbot.app/Contents/MacOS/noobsbot
          ls ~/Library/Fonts | grep -q JetBrainsMonoNerdFontMono
          command -v noobsbot
