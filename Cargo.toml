[package]
name = "noobsbot"
version = "0.5.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "GPU-rendered terminal emulator for Linux with tabs, splits, suggestions and situation-aware colors"
repository = "https://github.com/anil0403/noobsbot-terminal"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "gpu", "linux"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
arboard = { version = "3.6.1", default-features = false }
base64 = "0.22.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
cosmic-text = "0.19.0"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2.190"
log = "0.4.34"
miniz_oxide = "0.8.9"
notify = "8.2.0"
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
wgpu = "30.0.1"
winit = "0.30.13"
x11rb = "0.13.2"

[profile.release]
lto = "thin"
strip = true
